<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samsung Pointer — local preview</title>
<style>body{margin:24px;background:#10141d;color:#eee;font:15px system-ui}main{max-width:390px;margin:auto}h1{font-size:20px}ha-card{display:block;border-radius:22px;box-shadow:0 2px 10px #0005}#screen{position:relative;height:160px;border:1px solid #435063;border-radius:12px;margin:16px 0;overflow:hidden}#cursor{position:absolute;left:190px;top:80px;width:10px;height:10px;background:#63c8ff;border-radius:50%}#report{font-size:12px;white-space:pre-wrap}label{display:block;margin:12px 0}</style>
<main><h1>Samsung Pointer</h1><p>Локальный стенд. Команды на телевизор не отправляются.</p><label>Задержка тестового ответа <select id="delay"><option value="5">5 мс</option><option value="70">70 мс</option><option value="250">250 мс</option></select></label><div id="screen"><div id="cursor"></div></div><samsung-pointer-card></samsung-pointer-card><p id="report">Движений: 0 · Кликов: 0</p></main>
<script type="module">
import '../custom_components/samsung_pointer/www/samsung-pointer-card.js';
const card=document.querySelector('samsung-pointer-card'); let x=190,y=80,moves=0,clicks=0;
const hass={states:{'remote.preview':{state:'on'}},callService:async(domain,service,data,target)=>{
 await new Promise(r=>setTimeout(r,Number(document.querySelector('#delay').value)));
 if(service==='move'){x+=data.x;y+=data.y;moves++;document.querySelector('#cursor').style.transform=`translate(${x-190}px,${y-80}px)`;}
 if(service==='click')clicks++;
 document.querySelector('#report').textContent=`Движений: ${moves} · Кликов: ${clicks}\nx: ${x.toFixed(2)} · y: ${y.toFixed(2)}`;
}};
card.setConfig({entity:'remote.preview',show_latency:true});card.hass=hass;
</script>
