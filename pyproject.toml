[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "ASYNC109"]  # Pairing deliberately has a longer asyncio timeout.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC110"]  # Bounded waits for the simulated server's observations.

